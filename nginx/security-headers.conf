# ==============================================================================
# PT INDONESIA ASAHAN ALUMINIUM (INALUM) — DIVISI INTERNAL AUDIT
# Enterprise Security Headers & Content Security Policy (CSP) Configuration
# Task P7.2: Security Hardening for Production & SIT Environments
# ==============================================================================

# 1. Content Security Policy (CSP)
# - default-src: Same-origin default
# - script-src: 'self' only (no external untrusted script execution)
# - style-src: 'self' and 'unsafe-inline' (Tailwind CSS v4 & theme variables)
# - img-src: 'self', inline data URIs (QR codes), blobs (Dexie/PWA), and backend storage
# - connect-src: API backend Laravel, local proxies, and corporate domain
# - worker-src: Service worker registration (sw.js / workbox)
# - manifest-src: PWA manifest.webmanifest
# - frame-ancestors: 'none' (Strict anti-clickjacking)
# - base-uri: 'self' (Restricts <base> tag manipulation)
# - form-action: 'self' (Prohibits form submission to external domains)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://localhost:8000; font-src 'self'; connect-src 'self' http://localhost:8000 http://localhost:5174 https://*.inalum.id https://inventory.inalum.id; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

# 2. Anti-Clickjacking Protection
add_header X-Frame-Options "DENY" always;

# 3. MIME-Type Sniffing Prevention
add_header X-Content-Type-Options "nosniff" always;

# 4. Referrer Leakage Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 5. Hardware Sensor & Feature Policy (Minimizes Attack Surface)
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=(), usb=(), display-capture=()" always;

# 6. HTTP Strict Transport Security (HSTS)
# Catatan: Aktifkan 1 tahun max-age pada produksi HTTPS
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# 7. Cross-Origin Protection
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

