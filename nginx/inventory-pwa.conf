# ==============================================================================
# PT INDONESIA ASAHAN ALUMINIUM (INALUM) — DIVISI INTERNAL AUDIT
# Nginx Virtual Host Configuration for Inventory System Mobile PWA
# Task P7.2 / P7.7 / P7.8: Hardened Reverse Proxy & Static Host Configuration
# ==============================================================================

# HTTP -> HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name inventory.inalum.id;

    # Allow ACME challenge for SSL cert renewal if using Let's Encrypt / Corporate CA
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Production HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name inventory.inalum.id;

    # SSL / TLS 1.3 Configuration
    ssl_certificate /etc/ssl/certs/inalum_inventory.crt;
    ssl_certificate_key /etc/ssl/private/inalum_inventory.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Root Directory for Vite PWA Built Assets
    root /var/www/inventory-system-frontend/dist;
    index index.html;

    # Include Hardened Security Headers (Task P7.2)
    include /var/www/inventory-system-frontend/nginx/security-headers.conf;

    # Gzip Compression Optimization for PWA
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # 1. PWA Service Worker & Manifest: Never Cache Aggressively
    # Menjamin pembaruan aplikasi PWA langsung terdistribusi ke gawai auditor
    location ~* (sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        include /var/www/inventory-system-frontend/nginx/security-headers.conf;
    }

    # 2. Immutable Static Assets (Vite Unique Content Hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # 3. Proxy API Backend Laravel (Port 8000 Internal)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 4. Proxy Storage Media Uploads (Foto Item & Bukti Audit)
    location /storage/ {
        proxy_pass http://127.0.0.1:8000/storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. SPA Routing Fallback (HTML5 History API)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

